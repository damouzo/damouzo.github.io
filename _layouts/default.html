<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% if page.layout == "post" %}
  <meta property="article:author" content="https://www.linkedin.com/in/danielmouzo/">
  {% endif %}
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/dots.css' | relative_url }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/common.min.js"></script>
  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('damouzo-theme'); } catch (e) {}
      document.documentElement.setAttribute('data-theme', t === 'day' ? 'day' : 'night');
    })();
  </script>
</head>
<body>

  <!-- Particles background (same effect as the main page) -->
  <div id="particles-js"></div>

  <button class="theme-toggle" type="button" aria-label="Toggle day/night mode" title="Toggle day/night mode">
    <svg class="theme-toggle-sun" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 4.5v1.5 2.25M12 19.5v-1.5-2.25M4.5 12h2.25 1.5M19.5 12h-2.25-1.5M6.8 6.8l1.6 1.6M17.2 6.8l-1.6 1.6M6.8 17.2l1.6-1.6M17.2 17.2l-1.6-1.6"/></svg>
    <svg class="theme-toggle-moon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 12m-5 0a5 5 0 0 1 10 0a5 5 0 0 1-10 0z"/></svg>
  </button>

  <!-- Navbar: main sections pill + separate Blog pill (same visual language as the homepage) -->
  <header class="navbar">
    <div class="navbar-inner">
      <nav class="bubble-nav blog-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/' | relative_url }}#experience">Experience</a>
        <a href="{{ '/' | relative_url }}#projects">Projects</a>
        <a href="{{ '/' | relative_url }}#about">About</a>
        <a href="{{ '/' | relative_url }}#contact">Contact</a>
      </nav>
      <a href="{{ '/blog/' | relative_url }}" class="nav-pill nav-pill--blog active" aria-current="page">Blog</a>
    </div>
  </header>

  {{ content }}

  <script>
    if (window.hljs) hljs.highlightAll();
  </script>

  <script>
    window.__initParticles = function (theme) {
      var particleColor = theme === 'day' ? '#c9a03c' : '#ffffff';
      var particlesBox = document.getElementById('particles-js');
      if (!particlesBox) return;
      while (particlesBox.firstChild) particlesBox.removeChild(particlesBox.firstChild);
      if (typeof particlesJS !== 'function') return;
      particlesJS("particles-js", {
        "particles": {
          "number": {
            "value": 160,
            "density": {
              "enable": true,
              "value_area": 800
            }
          },
          "color": {
            "value": particleColor
          },
          "shape": {
            "type": "circle",
            "stroke": {
              "width": 0,
              "color": "#000000"
            },
            "polygon": {
              "nb_sides": 5
            }
          },
          "opacity": {
            "value": 0.6,
            "random": true,
            "anim": {
              "enable": true,
              "speed": 0.6,
              "opacity_min": 0.2,
              "sync": false
            }
          },
          "size": {
            "value": 2,
            "random": true,
            "anim": {
              "enable": false,
              "speed": 4,
              "size_min": 0.3,
              "sync": false
            }
          },
          "line_linked": {
            "enable": false,
            "distance": 150,
            "color": particleColor,
            "opacity": 0.4,
            "width": 1
          },
          "move": {
            "enable": true,
            "speed": 0.5,
            "direction": "none",
            "random": true,
            "straight": false,
            "out_mode": "out",
            "bounce": false,
            "attract": {
              "enable": false,
              "rotateX": 600,
              "rotateY": 600
            }
          }
        },
        "interactivity": {
          "detect_on": "canvas",
          "events": {
            "onhover": {
              "enable": true,
              "mode": "repulse"
            },
            "onclick": {
              "enable": true,
              "mode": "push"
            },
            "resize": true
          },
          "modes": {
            "grab": {
              "distance": 200,
              "line_linked": {
                "opacity": 0.3
              }
            },
            "bubble": {
              "distance": 200,
              "size": 4,
              "duration": 2,
              "opacity": 0.8,
              "speed": 3
            },
            "repulse": {
              "distance": 150,
              "duration": 0.4
            },
            "push": {
              "particles_nb": 4
            },
            "remove": {
              "particles_nb": 2
            }
          }
        },
          "retina_detect": true
        });
    };
    window.__initParticles(document.documentElement.getAttribute('data-theme') === 'day' ? 'day' : 'night');
  </script>

  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>

</body>
</html>
