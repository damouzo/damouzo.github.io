---
layout: default
---
<div class="blog-container">
<div class="bg-layer dots-bg-blog" aria-hidden="true">
<span class="bg-dot" style="left:4%;top:12%;width:22px;height:22px;background:radial-gradient(circle,var(--dot-navy),transparent 72%);animation:float-1 13s ease-in-out infinite;animation-delay:-5s"></span>
<span class="bg-dot" style="left:94%;top:20%;width:20px;height:20px;background:radial-gradient(circle,var(--dot-gold),transparent 72%);animation:float-3 17s ease-in-out infinite;animation-delay:-4s"></span>
<span class="bg-dot" style="left:6%;top:48%;width:24px;height:24px;background:radial-gradient(circle,var(--dot-teal),transparent 72%);animation:float-2 11s ease-in-out infinite;animation-delay:-10s"></span>
<span class="bg-dot" style="left:93%;top:58%;width:22px;height:22px;background:radial-gradient(circle,var(--dot-maroon),transparent 72%);animation:float-4 15s ease-in-out infinite;animation-delay:-8s"></span>
<span class="bg-dot" style="left:5%;top:82%;width:20px;height:20px;background:radial-gradient(circle,var(--dot-gold),transparent 72%);animation:float-5 18s ease-in-out infinite;animation-delay:-10s"></span>
<span class="bg-dot" style="left:94%;top:88%;width:22px;height:22px;background:radial-gradient(circle,var(--dot-navy),transparent 72%);animation:float-0 12s ease-in-out infinite;animation-delay:-6s"></span>
</div>
  <div class="blog-layout">
    {% include blog-sidebar.html %}
    <main class="blog-main" id="blog-main">
      {{ content }}
    </main>
  </div>
</div>
<script src="{{ '/assets/js/blog.js' | relative_url }}" defer></script>
