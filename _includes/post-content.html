{% assign post = include.post %}
<article class="post-content" data-post-url="{{ post.url | relative_url }}">
  <p class="post-meta">{{ post.date | date: "%d %B %Y" }}</p>
  <h1>{{ post.title }}</h1>
  <div class="post-tags">
    {% for tag in post.tags %}<span class="tag-badge">{{ tag }}</span>{% endfor %}
  </div>
  <div class="post-body">
    {{ post.content }}
  </div>
</article>
