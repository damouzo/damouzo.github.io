<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
  <!-- Círculo central -->
  <circle cx="12" cy="12" r="5" />
  
  <!-- Rayos principales -->
  <rect x="11" y="1" width="2" height="4" rx="1" />
  <rect x="11" y="19" width="2" height="4" rx="1" />
  <rect x="1" y="11" width="4" height="2" rx="1" />
  <rect x="19" y="11" width="4" height="2" rx="1" />
  
  <!-- Rayos diagonales (rotados 45 grados desde el centro) -->
  <rect x="11" y="1" width="2" height="4" rx="1" transform="rotate(45 12 12)" />
  <rect x="11" y="19" width="2" height="4" rx="1" transform="rotate(45 12 12)" />
  <rect x="1" y="11" width="4" height="2" rx="1" transform="rotate(45 12 12)" />
  <rect x="19" y="11" width="4" height="2" rx="1" transform="rotate(45 12 12)" />
</svg>
